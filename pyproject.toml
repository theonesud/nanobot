[project]
name = "nanobot-ai"
version = "0.1.4.post2"
description = "A lightweight personal AI assistant framework"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "nanobot contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer==0.24.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "websockets==16.0",
    "websocket-client==1.9.0",
    "httpx==0.28.1",
    "oauth-cli-kit==0.1.3",
    "loguru==0.7.3",
    "readability-lxml==0.8.4.1",
    "rich==14.3.3",
    "croniter==6.0.0",
    "dingtalk-stream==0.24.3",
    "python-telegram-bot[socks]==22.6",
    "lark-oapi==1.5.3",
    "socksio==1.0.0",
    "python-socketio==5.16.1",
    "msgpack==1.1.2",
    "slack-sdk==3.40.1",
    "slackify-markdown==0.2.2",
    "slack-bolt==1.27.0",
    "apscheduler==3.11.2",
    "qq-botpy==1.2.1",
    "python-socks[asyncio]==2.8.1",
    "prompt-toolkit==3.0.52",
    "mcp==1.26.0",
    "json-repair==0.58.3",
    "playwright==1.58.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
matrix = [
    "matrix-nio[e2e]==0.25.2",
    "mistune==3.2.0",
    "nh3==0.3.3",
]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-timeout==2.4.0",
    "httpx==0.28.1",
    "ruff==0.15.4",
    "vulture==2.14",
]

[project.scripts]
nanobot = "nanobot.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanobot"]

[tool.hatch.build.targets.wheel.sources]
"nanobot" = "nanobot"

# Include non-Python files in skills and templates
[tool.hatch.build]
include = [
    "nanobot/**/*.py",
    "nanobot/templates/**/*.md",
    "nanobot/skills/**/*.md",
    "nanobot/skills/**/*.sh",
]

[tool.hatch.build.targets.sdist]
include = [
    "nanobot/",
    "bridge/",
    "README.md",
    "LICENSE",
]

[tool.hatch.build.targets.wheel.force-include]
"bridge" = "nanobot/bridge"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501", "C901"]

[tool.ruff.lint.isort]
known-first-party = ["nanobot", "bridge", "tests", "case"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.vulture]
ignore_names = [
    "*Channel", "stop", "send", "_ws_connected", "connect_error", "on_session_events", 
    "on_panel_events", "C2CMessage", "on_ready", "on_c2c_message_create", 
    "on_direct_message_create", "main", "channels_status", "channels_login", 
    "cron_list", "cron_add", "cron_remove", "cron_enable", "cron_run", 
    "provider_login", "_login_openai_codex", "_login_github_copilot", 
    "model_config", "mode", "webhook_path", "user_token_read_only", 
    "reply_in_thread", "matrix", "custom", "anthropic", "openai", "openrouter", 
    "deepseek", "zhipu", "dashscope", "vllm", "gemini", "moonshot", "minimax", 
    "aihubmix", "siliconflow", "volcengine", "openai_codex", "github_copilot", 
    "opencode", "host", "suppress_debug_info", "drop_params", "add_message", "save",
    "mock_config", "event_loop", "side_effect", "__aexit__", "set_send_callback",
    "on_message", "gateway", "whatsapp", "telegram", "slack", "summarize_git_diffs",
    "nightly_soul_update", "nightly_self_optimization", "handle_approval",
    "consume_inbound", "message_content", "stop_all", "exec_tool"
]
