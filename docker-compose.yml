x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - /opt/nanobot/config:/home/nanobot/.nanobot
    - /opt/nanobot/opencode:/home/nanobot/.opencode
    # Required for Docker-out-of-Docker (agent spawning sibling containers via exec tool)
    - /var/run/docker.sock:/var/run/docker.sock

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    entrypoint: ["sh", "-c"]
    command: ["cd /app/bridge && node dist/index.js & exec nanobot gateway"]
    restart: unless-stopped
    ports:
      - 18790:18790
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  nanobot-cli:
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
