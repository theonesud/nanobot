x-common-config: &common-config
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    # Map host config to container config
    - ${HOME}/.nanobot:/home/nanobot/.nanobot
    - ${HOME}/.opencode:/home/nanobot/.opencode
    # PATH IDENTITY: Mount the repo at the exact same absolute path
    # and set it as the working directory. This ensures sibling containers
    # (Docker-out-of-Docker) can resolve paths correctly.
    - ${PWD}:${PWD}
    - /var/run/docker.sock:/var/run/docker.sock
  working_dir: ${PWD}

services:
  nanobot-gateway:
    container_name: nanobot-gateway
    <<: *common-config
    entrypoint: ["sh", "-c"]
    command: ["cd /app/bridge && node dist/index.js & exec nanobot gateway"]
    ports:
      - 18790:18790
    restart: unless-stopped

  nanobot-cli:
    container_name: nanobot-cli
    <<: *common-config
    profiles:
      - cli
    command: ["status"]
    stdin_open: true
    tty: true
